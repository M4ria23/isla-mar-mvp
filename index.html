const $ = (selector) => document.querySelector(selector);
const readStored = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
const saveStored = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } };
const safe = (value = '') => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
const money = (number, suffix = false) => '$' + Math.round(Number(number) || 0).toLocaleString('es-CO') + (suffix ? ' COP' : '');
const kgLabel = (weight) => Number(weight).toLocaleString('es-CO', { maximumFractionDigits: 1 }) + ' kg';
const fmtDate = (iso) => { try { return new Date(iso).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }); } catch { return iso; } };

function icon(name, size = 22) { return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name] || iconPaths.grid}</svg>`; }

const state = {
  products: INITIAL_PRODUCTS.map(product => ({ ...product })),
  cart: readStored(STORAGE.cart, {}),
  orders: readStored(STORAGE.orders, []),
  profile: readStored(STORAGE.profile, { name: '', phone: '' }),
  category: 'Todos',
  search: '',
  sort: 'default',
  apiEnabled: false,
  confirmed: null,
  pendingSubmit: false
};
const appView = $('#app-view');
let toastTimeout;
const currentPage = () => location.hash.replace(/^#/, '').split('?')[0] || 'inicio';
function navigate(page) { if (currentPage() === page) { render(); window.scrollTo({ top: 0 }); } else { location.hash = page; } }
function cartQty(id) { return Number(state.cart[id] || 0); }
function cartLines() { return state.products.filter(product => cartQty(product.id) > 0).map(product => ({ ...product, quantity: cartQty(product.id), subtotal: cartQty(product.id) * product.price })); }
function cartTotal() { return cartLines().reduce((sum, product) => sum + product.subtotal, 0); }
function cartWeight() { return cartLines().reduce((sum, product) => sum + product.quantity, 0); }
function cartCount() { return cartLines().length; }
function updateCartBadge() { const badge = $('#cart-count'); badge.textContent = cartCount(); badge.hidden = cartCount() === 0; }
function notify(message) { const toast = $('#toast'); toast.textContent = message; toast.classList.add('visible'); clearTimeout(toastTimeout); toastTimeout = setTimeout(() => toast.classList.remove('visible'), 2600); }
function setQty(id, quantity) {
  const product = state.products.find(p => p.id === id);
  if (!product || (!product.available && quantity > cartQty(id))) return;
  const amount = Math.max(0, Math.min(20, Math.round(quantity * 2) / 2));
  if (amount <= 0) delete state.cart[id]; else state.cart[id] = amount;
  saveStored(STORAGE.cart, state.cart);
  const scrollY = window.scrollY;
  render();
  window.scrollTo({ top: scrollY, behavior: 'instant' });
}

function productCard(product) {
  return `<article class="product-card">
    <img src="${safe(product.image)}" alt="${safe(product.name)} sobre hielo" loading="lazy">
    <div class="product-info">
      <h3>${safe(product.name)}</h3><p class="product-desc">${safe(product.description)}</p>
      <div class="product-price">${money(product.price, true)}/kg</div>
      <div class="product-meta"><span>${product.available ? 'Crudo · Fresco' : '<span class="unavailable">Agotado</span>'}</span>
        <button class="small-add" type="button" data-action="add" data-id="${safe(product.id)}" aria-label="Agregar 0,5 kg de ${safe(product.name)}" ${product.available ? '' : 'disabled'}>+</button>
      </div>
    </div>
  </article>`;
}
function heading(title, subtitle, back = false) {
  return `<div class="intro-title">${back ? `<button class="back-link" type="button" data-go="inicio">${icon('back', 19)} ${safe(title)}</button>` : ''}
    <h1>${safe(back ? subtitle.title : title)}</h1><p class="subtitle">${safe(back ? subtitle.desc : subtitle)}</p></div>`;
}
function searchBar(home = false) {
  return `<form id="${home ? 'home-search-form' : 'catalog-search-form'}" class="searchbar" role="search">
    ${icon('search', 22)}<input id="${home ? 'home-search' : 'catalog-search'}" type="search" autocomplete="off" placeholder="Busca pescado o mariscos" aria-label="Buscar productos" value="${safe(state.search)}">
    <span class="search-filter" aria-hidden="true">${icon('sliders', 22)}</span>
  </form>`;
}
function renderHome() {
  return `<section class="home-start">
    <div class="intro-title"><h1>¿Qué vas a cocinar hoy?</h1><p class="subtitle">Frescura para tus mejores preparaciones.</p></div>
    ${searchBar(true)}
    <div class="home-hero"><div class="hero-body"><p class="eyebrow">Del mar a tu cocina</p>
      <h2>Fresco por<br>naturaleza.</h2><p>Productos del mar para compartir en familia.</p>
      <button class="hero-cta" type="button" data-go="catalogo">Explorar productos ${icon('arrow', 18)}</button>
    </div></div>
    <div class="quick-categories" aria-label="Categorías de productos">
      ${[['Pescados','fish'],['Mariscos','shell'],['Filetes','cutlery'],['Todos','grid']].map(([label, sym]) => `<button class="category-btn" type="button" data-action="category" data-category="${label}"><span class="category-icon">${icon(sym, 25)}</span><span>${label}</span></button>`).join('')}
    </div>
    <div class="head-row"><h2>Nuestros destacados</h2><button type="button" class="text-link" data-action="category" data-category="Todos">Ver todos ${icon('arrow', 15)}</button></div>
    <div class="products-grid">${state.products.slice(0, 2).map(productCard).join('')}</div>
    <button type="button" class="bottom-banner" data-go="catalogo"><span class="banner-icon">♨</span><span><strong>Un viaje por nuestros sabores</strong><small>Recetas regionales · Productos frescos del mar</small></span><span class="right-arrow">→</span></button>
    <p class="disclaimer">Precios ficticios de ejemplo, expresados en COP/kg. La disponibilidad debe confirmarse con Isla Mar.</p>
  </section>`;
}
function filteredProducts() {
  const query = state.search.trim().toLocaleLowerCase('es');
  let result = state.products.filter(product => (state.category === 'Todos' || product.category === state.category) && (`${product.name} ${product.description} ${product.category}`).toLocaleLowerCase('es').includes(query));
  if (state.sort === 'low') result.sort((a, b) => a.price - b.price);
  if (state.sort === 'high') result.sort((a, b) => b.price - a.price);
  if (state.sort === 'az') result.sort((a, b) => a.name.localeCompare(b.name, 'es'));
  return result;
}
function catalogResults() {
  const result = filteredProducts();

    <label class="sort-box">Ordenar: <select id="sort-products" aria-label="Ordenar productos"><option value="default" ${state.sort === 'default' ? 'selected' : ''}>Destacados</option><option value="low" ${state.sort === 'low' ? 'selected' : ''}>Menor precio</option><option value="high" ${state.sort === 'high' ? 'selected' : ''}>Mayor precio</option><option value="az" ${state.sort === 'az' ? 'selected' : ''}>Nombre A-Z</option></select></label>
  </div>
  ${result.length ? `<div class="products-grid">${result.map(productCard).join('')}</div>` : `<div class="empty-state"><div class="empty-symbol">🐟</div><h2>No encontramos productos</h2><p>Intenta otra palabra o selecciona una categoría diferente.</p><button class="secondary-button" data-action="clear-filters" type="button">Ver todos</button></div>`}`;
}
function renderCatalog() {
  return `<section>
    <button class="back-link" data-go="inicio" type="button">${icon('back', 19)} Catálogo</button>
    <div class="catalog-head"><div><h1>Frescura a tu medida</h1><p class="subtitle" style="margin-bottom:0">Pescado y mariscos crudos, por kilogramo.</p></div></div>
    ${searchBar(false)}
    <div class="catalog-controls" aria-label="Filtrar por categoría">
      ${['Todos','Pescados','Mariscos','Filetes'].map(category => `<button type="button" class="pill ${state.category === category ? 'selected' : ''}" data-action="category" data-category="${category}" aria-pressed="${state.category === category}">${category}</button>`).join('')}
    </div>
    <div id="catalog-results">${catalogResults()}</div>
    <p class="disclaimer">Valores de ejemplo en COP/kg. Confirma disponibilidad, precio final y condiciones con Isla Mar.</p>
  </section>`;
}
function steps(active) { return `<div class="step-indicator"><span class="${active === 1 ? 'active' : 'completed'}">01 CARRITO</span><span>—</span><span class="${active === 2 ? 'active' : active === 3 ? 'completed' : ''}">02 DATOS</span><span>—</span><span class="${active === 3 ? 'active' : ''}">03 CONFIRMACIÓN</span></div>`; }
function emptyCart() { return `<section><button class="back-link" data-go="catalogo" type="button">${icon('back', 19)} Carrito</button><div class="empty-state"><div class="empty-symbol">🛒</div><h2>Tu carrito está vacío</h2><p>Explora nuestros pescados y mariscos. Puedes agregar productos de 0,5 kg en 0,5 kg.</p><button class="primary-button" type="button" data-go="catalogo">Explorar catálogo ${icon('arrow', 17)}</button></div></section>`; }
function cartProduct(product) {
  return `<article class="cart-product"><img src="${safe(product.image)}" alt="${safe(product.name)}" loading="lazy">
    <div><h3>${safe(product.name)}</h3><p class="muted">${money(product.price, true)}/kg · Crudo</p>
      <div class="stepper"><button type="button" data-action="decrease" data-id="${safe(product.id)}" aria-label="Restar 0,5 kg de ${safe(product.name)}">−</button><span>${kgLabel(product.quantity)}</span><button type="button" data-action="add" data-id="${safe(product.id)}" aria-label="Añadir 0,5 kg de ${safe(product.name)}" ${!product.available || product.quantity >= 20 ? 'disabled' : ''}>+</button></div>
    </div>
    <div class="cart-price"><button type="button" class="remove-button" data-action="remove" data-id="${safe(product.id)}" aria-label="Eliminar ${safe(product.name)}">${icon('trash', 19)}</button><strong>${money(product.subtotal, true)}</strong></div>
  </article>`;
}
function summaryPanel(includeButtons = false) {
  return `<aside class="checkout-side"><div class="panel order-summary"><h3>Resumen del pedido</h3>
    ${cartLines().map(item => `<div class="summary-line"><span>${safe(item.name)} · ${kgLabel(item.quantity)}</span><span>${money(item.subtotal)}</span></div>`).join('')}
    <div class="summary-total"><span>Total de productos</span><strong>${money(cartTotal())}</strong></div>
    <p class="helper" style="margin:13px 0 0">Valores ficticios en COP. Solo productos; envío no incluido.</p></div>
    <div class="info-box">${icon('info', 19)}<span>Este MVP es demostrativo. No realiza cobros ni envía pedidos reales. La disponibilidad y los valores finales deben confirmarse con Isla Mar.</span></div>
    ${includeButtons ? `<div class="side-actions"><button class="primary-button block" type="button" data-go="datos">Continuar con mis datos ${icon('arrow', 19)}</button><button class="text-link" type="button" data-go="catalogo">Seguir explorando el catálogo</button></div>` : ''}
  </aside>`;
}
function renderCart() {
  if (!cartCount()) return emptyCart();
  return `<section><button class="back-link" data-go="catalogo" type="button">${icon('back', 19)} Carrito</button>${steps(1)}
    <h1>Tu selección del mar</h1><p class="subtitle">${cartCount()} producto${cartCount() === 1 ? '' : 's'} · ${kgLabel(cartWeight())} en total</p>
    <div class="checkout-layout"><div class="checkout-main"><div class="panel">${cartLines().map(cartProduct).join('')}</div></div>${summaryPanel(true)}</div>
  </section>`;
}
function renderCheckout() {
  if (!cartCount()) return emptyCart();
  const { name, phone } = state.profile;
  return `<section><button class="back-link" data-go="carrito" type="button">${icon('back', 19)} Volver al carrito</button>${steps(2)}<h1>Datos para tu pedido</h1>
    <p class="subtitle">Completa tus datos para simular la solicitud de compra.</p>
    <div class="checkout-layout"><div class="checkout-main"><div class="panel">
      <form id="checkout-form">
        <div class="form-grid"><div class="field"><label for="customer-name">Nombre completo *</label><input id="customer-name" name="name" autocomplete="name" maxlength="90" minlength="3" required placeholder="Tu nombre" value="${safe(name)}"></div>
        <div class="field"><label for="customer-phone">Celular *</label><input id="customer-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" minlength="7" maxlength="18" required placeholder="300 123 4567" value="${safe(phone)}"></div></div>
        <div class="field"><label>¿Cómo prefieres recibir tu pedido? *</label><div class="radio-options"><label class="radio-option"><input type="radio" name="fulfillment" value="pickup" checked> Recoger en la pescadería</label><label class="radio-option"><input type="radio" name="fulfillment" value="delivery"> Entrega a domicilio</label></div></div>
        <div class="field" id="address-field" hidden><label for="customer-address">Dirección y barrio *</label><input id="customer-address" name="address" maxlength="180" placeholder="Dirección, barrio y referencia"><span class="helper">La cobertura y costo de entrega son de demostración y deben confirmarse.</span></div>
        <div class="field"><label for="customer-notes">Observaciones (opcional)</label><textarea id="customer-notes" name="notes" maxlength="500" placeholder="Por ejemplo: corte preferido, instrucciones o una consulta"></textarea></div>
        <label class="checkbox-line"><input type="checkbox" name="demo_ok" required><span>Entiendo que esta es una simulación académica: el pedido se registra para probar el sistema, pero no se envía automáticamente a la pescadería ni confirma una compra.</span></label>
        <button class="primary-button block" type="submit" id="place-order" style="margin-top:22px">Confirmar pedido de demostración ${icon('arrow', 18)}</button>
      </form></div></div>${summaryPanel(false)}</div>
  </section>`;
}
function renderConfirmation() {
  const order = state.confirmed;
  if (!order) return `<section class="confirmation"><div class="empty-state"><h1>Sin una confirmación reciente</h1><p>Puedes consultar tus pedidos de prueba guardados en este dispositivo.</p><button class="primary-button" data-go="pedidos">Ver mis pedidos</button></div></section>`;
  return `<section class="confirmation">${steps(3)}<div class="check-circle">✓</div><h1>¡Pedido de prueba registrado!</h1>
    <p class="muted">Tu selección quedó guardada ${order.sync === 'server' ? 'en la base de datos del MVP y en este dispositivo' : 'en este navegador'}. Aún no representa una compra real.</p>
    <div class="panel"><p class="confirm-code">Número de referencia<strong>${safe(order.order_code)}</strong></p>
      <div class="summary-line"><span>Cliente</span><span>${safe(order.customer.name)}</span></div>
      <div class="summary-line"><span>Entrega</span><span>${order.customer.fulfillment === 'delivery' ? 'Domicilio (simulación)' : 'Recoger en la pescadería'}</span></div>
      <div class="summary-line"><span>Productos</span><span>${order.items.length} · ${kgLabel(order.items.reduce((sum, item) => sum + item.quantity, 0))}</span></div>
      <div class="summary-line"><span>Estado</span><span>Sin confirmar por el negocio</span></div>
      <div class="summary-total"><span>Total estimado</span><strong>${money(order.total)}</strong></div>
    </div><div class="info-box" style="text-align:left">${icon('info', 19)}<span>Este comprobante solo valida el funcionamiento del MVP. Para comprar realmente, debes contactar a la pescadería y confirmar existencia, precio y entrega.</span></div>
    <div class="confirm-actions"><button class="primary-button" data-go="pedidos">Ver mis pedidos</button><button class="secondary-button" data-go="catalogo">Volver al catálogo</button></div>
  </section>`;
}
function renderOrders() {
  const orders = [...state.orders].reverse();
  return `<section><button class="back-link" data-go="inicio" type="button">${icon('back', 19)} Pedidos</button>
    <h1>Mis pedidos de prueba</h1><p class="subtitle">Se muestran los registros guardados en este navegador. No son pedidos reales.</p>
    ${orders.length ? orders.map(order => `<article class="order-record"><div><h3>${safe(order.order_code)} <span class="status-pill">Simulación</span></h3><p>${safe(fmtDate(order.created_at))}</p><p>${order.items.map(item => `${safe(item.name)} (${kgLabel(item.quantity)})`).join(' · ')}</p><p>${order.customer.fulfillment === 'delivery' ? 'Entrega a domicilio' : 'Recogida'} · ${order.sync === 'server' ? 'Registrado en la API' : 'Guardado local'}</p></div><strong>${money(order.total)}</strong></article>`).join('') : `<div class="empty-state"><div class="empty-symbol">📦</div><h2>Todavía no tienes pedidos</h2><p>Agrega productos y completa el formulario de prueba para guardar un registro aquí.</p><button class="primary-button" type="button" data-go="catalogo">Ver catálogo</button></div>`}
    ${orders.length ? `<div style="margin-top:24px"><button type="button" class="secondary-button" data-go="catalogo">Preparar otro pedido</button></div>` : ''}
  </section>`;
}
function renderProfile() {
  return `<section><button class="back-link" data-go="inicio" type="button">${icon('back', 19)} Perfil</button><h1>Mi perfil</h1>
    <p class="subtitle">Guarda tus datos de demostración para agilizar el siguiente pedido desde este navegador.</p>
    <div class="profile-grid"><div class="panel"><h2 style="font-size:21px;margin-bottom:16px">Información de contacto</h2>
      <form id="profile-form"><div class="field"><label for="profile-name">Nombre completo</label><input id="profile-name" name="name" maxlength="90" placeholder="Tu nombre" value="${safe(state.profile.name)}"></div>
        <div class="field"><label for="profile-phone">Número de celular</label><input id="profile-phone" name="phone" type="tel" maxlength="18" placeholder="Tu celular" value="${safe(state.profile.phone)}"></div>
        <button class="primary-button" type="submit">Guardar mis datos ${icon('check', 17)}</button></form>
    </div><div class="profile-aside">${icon('user', 35)}<h3>Isla Mar, a tu medida</h3>
      <p>En este MVP no hay cuentas de usuario ni contraseñas. Los datos de perfil y el historial se guardan en tu navegador.</p>
      <p><strong>${state.orders.length}</strong> pedido${state.orders.length === 1 ? '' : 's'} de demostración almacenado${state.orders.length === 1 ? '' : 's'} en este dispositivo.</p>
      <button class="secondary-button" type="button" data-go="pedidos">Consultar mis pedidos</button></div></div>
  </section>`;
}
function mobileNav() {
  const page = currentPage(); const selected = page === 'datos' || page === 'confirmacion' ? 'carrito' : page;
  const links = [['inicio', 'home', 'Inicio'], ['catalogo', 'fish', 'Catálogo'], ['pedidos', 'bag', 'Pedidos'], ['perfil', 'user', 'Perfil']];
  $('#mobile-nav').innerHTML = links.map(([route, symbol, label]) => `<a href="#${route}" class="${selected === route ? 'active' : ''}" ${selected === route ? 'aria-current="page"' : ''}>${icon(symbol)}<span>${label}</span></a>`).join('');
}
function updateDesktopNav() { document.querySelectorAll('.desktop-nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === currentPage())); }
function render() {
  const page = currentPage();
  const views = { inicio: renderHome, catalogo: renderCatalog, carrito: renderCart, datos: renderCheckout, confirmacion: renderConfirmation, pedidos: renderOrders, perfil: renderProfile };
  appView.innerHTML = (views[page] || renderHome)();
  updateCartBadge(); mobileNav(); updateDesktopNav();
  document.title = `Isla Mar | ${({ inicio:'Inicio', catalogo:'Catálogo', carrito:'Carrito', datos:'Datos', confirmacion:'Confirmación', pedidos:'Mis pedidos', perfil:'Perfil' })[page] || 'Frescura a tu medida'}`;
}
function changeCategory(category) { state.category = category; state.search = ''; navigate('catalogo'); }
function refreshCatalogResults() { if (currentPage() === 'catalogo') { const results = $('#catalog-results'); if (results) results.innerHTML = catalogResults(); } }

appView.addEventListener('click', event => {
  const control = event.target.closest('button[data-action],button[data-go]');
  if (!control) return;
  if (control.dataset.go) { navigate(control.dataset.go); return; }
  const { action, id, category } = control.dataset;
  if (action === 'add') { setQty(id, cartQty(id) + .5); notify('Agregaste 0,5 kg al carrito'); }
  if (action === 'decrease') setQty(id, cartQty(id) - .5);
  if (action === 'remove') { setQty(id, 0); notify('Producto eliminado del carrito'); }
  if (action === 'category') changeCategory(category);
  if (action === 'clear-filters') { state.category = 'Todos'; state.search = ''; state.sort = 'default'; render(); }
});
appView.addEventListener('input', event => {
  if (event.target.id === 'catalog-search') { state.search = event.target.value; refreshCatalogResults(); }
});
appView.addEventListener('change', event => {
  if (event.target.id === 'sort-products') { state.sort = event.target.value; refreshCatalogResults(); }
  if (event.target.name === 'fulfillment') { const field = $('#address-field'); const address = $('#customer-address'); const delivery = event.target.value === 'delivery'; field.hidden = !delivery; address.required = delivery; }
});
appView.addEventListener('submit', async event => {
  if (event.target.id === 'home-search-form') { event.preventDefault(); state.search = $('#home-search').value; state.category = 'Todos'; navigate('catalogo'); return; }
  if (event.target.id === 'catalog-search-form') { event.preventDefault(); state.search = $('#catalog-search').value; refreshCatalogResults(); return; }
  if (event.target.id === 'profile-form') { event.preventDefault(); const data = new FormData(event.target); state.profile = { name: String(data.get('name') || '').trim(), phone: String(data.get('phone') || '').trim() }; saveStored(STORAGE.profile, state.profile); notify('Datos guardados en este navegador'); return; }
  if (event.target.id === 'checkout-form') { event.preventDefault(); await submitOrder(event.target); }
});
async function submitOrder(form) {
  if (state.pendingSubmit || !cartCount()) return;
  const data = new FormData(form);
  const name = String(data.get('name') || '').trim(), phone = String(data.get('phone') || '').trim();
  const fulfillment = String(data.get('fulfillment') || 'pickup');
  const address = String(data.get('address') || '').trim(), notes = String(data.get('notes') || '').trim();
  if (name.length < 3) return notify('Escribe tu nombre completo');
  if (!/^[+\d\s()-]{7,18}$/.test(phone) || phone.replace(/\D/g, '').length < 7) return notify('Ingresa un número de celular válido');
  if (fulfillment === 'delivery' && address.length < 5) return notify('Escribe la dirección de entrega');
  if (!data.has('demo_ok')) return notify('Acepta que es un pedido de demostración');
  state.pendingSubmit = true; const button = $('#place-order'); button.disabled = true; button.textContent = 'Guardando pedido...';
  const customer = { name, phone, fulfillment, address: fulfillment === 'delivery' ? address : '', notes };
  const items = cartLines().map(item => ({ id: item.id, name: item.name, price: item.price, quantity: item.quantity, subtotal: item.subtotal }));
  const draft = { customer, items, total: cartTotal(), created_at: new Date().toISOString(), order_code: 'IM-' + Date.now().toString().slice(-8), sync: 'local' };
  let order = draft;
  try {
    if (state.apiEnabled) {
      const response = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ customer, items: items.map(item => ({ id: item.id, quantity: item.quantity })) }) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'No fue posible registrar el pedido');
      order = { ...draft, ...result.order, sync: 'server' };
    }
    state.orders.push(order);
    saveStored(STORAGE.orders, state.orders);
    state.profile = { name, phone }; saveStored(STORAGE.profile, state.profile);
    state.cart = {}; saveStored(STORAGE.cart, state.cart);
    state.confirmed = order;
    navigate('confirmacion');
  } catch (error) {
    notify('No se pudo guardar en el servidor: ' + error.message);
    button.disabled = false; button.textContent = 'Volver a intentar';
  } finally { state.pendingSubmit = false; }
}
async function loadProducts() {
  // Al publicarse en GitHub Pages, la API no existe: usa el catálogo y localStorage.
  try {
    const response = await fetch('/api/products', { headers: { Accept: 'application/json' }, signal: AbortSignal.timeout(2200) });
    if (!response.ok || !response.headers.get('content-type')?.includes('application/json')) return;
    const products = await response.json();
    if (!Array.isArray(products) || !products.length) return;
    state.products = products.map(product => ({ ...product, price: Number(product.price), available: Boolean(product.available) }));
    state.apiEnabled = true;
    render();
  } catch { /* Modo web estático y fuera de línea */ }
}
window.addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0, behavior: 'instant' }); });
$('#year').textContent = new Date().getFullYear();
render();
loadProducts();

</script>
</body>
</html>
